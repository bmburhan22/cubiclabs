<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#gradient)"/>

  <!-- Grid pattern -->
  <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
    <path d="M 50 0 L 0 0 0 50" fill="none" stroke="rgba(0, 240, 255, 0.1)" stroke-width="1"/>
  </pattern>
  <rect width="1920" height="1080" fill="url(#grid)"/>

  <!-- Header -->
  <rect x="0" y="0" width="1920" height="80" fill="rgba(0, 0, 0, 0.3)" stroke="rgba(0, 240, 255, 0.2)" stroke-width="1"/>

  <!-- Logo -->
  <circle cx="60" cy="40" r="20" fill="url(#logoGradient)"/>
  <text x="90" y="50" font-family="Arial" font-size="24" font-weight="bold" fill="white">Cubiclabs</text>

  <!-- Navigation -->
  <text x="1400" y="50" font-family="Arial" font-size="16" fill="#e0e0e0">Home</text>
  <text x="1500" y="50" font-family="Arial" font-size="16" fill="#e0e0e0">About</text>
  <text x="1600" y="50" font-family="Arial" font-size="16" fill="#e0e0e0">Pricing</text>
  <text x="1700" y="50" font-family="Arial" font-size="16" fill="#e0e0e0">Contact</text>

  <!-- Main Content -->
  <g transform="translate(200, 200)">
    <!-- Hero Title -->
    <text x="0" y="0" font-family="Arial" font-size="64" font-weight="bold" fill="white">Welcome to the Future</text>
    <text x="0" y="80" font-family="Arial" font-size="32" fill="#00f0ff">Building tomorrow's technology, today</text>

    <!-- CTA Button -->
    <rect x="0" y="150" width="200" height="60" rx="10" fill="url(#buttonGradient)"/>
    <text x="50" y="190" font-family="Arial" font-size="18" font-weight="bold" fill="white">Get Started</text>
  </g>

  <!-- Cards -->
  <g transform="translate(200, 500)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="400" height="250" rx="15" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(0, 240, 255, 0.2)" stroke-width="2"/>
    <circle cx="50" cy="50" r="25" fill="url(#iconGradient1)"/>
    <text x="20" y="130" font-family="Arial" font-size="24" font-weight="bold" fill="white">Lightning Fast</text>
    <text x="20" y="165" font-family="Arial" font-size="14" fill="#a0a0a0">Unparalleled performance</text>
    <text x="20" y="185" font-family="Arial" font-size="14" fill="#a0a0a0">with cutting-edge tech</text>

    <!-- Card 2 -->
    <rect x="450" y="0" width="400" height="250" rx="15" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 0, 110, 0.2)" stroke-width="2"/>
    <circle cx="500" cy="50" r="25" fill="url(#iconGradient2)"/>
    <text x="470" y="130" font-family="Arial" font-size="24" font-weight="bold" fill="white">Secure & Reliable</text>
    <text x="470" y="165" font-family="Arial" font-size="14" fill="#a0a0a0">Enterprise-grade security</text>
    <text x="470" y="185" font-family="Arial" font-size="14" fill="#a0a0a0">for your peace of mind</text>

    <!-- Card 3 -->
    <rect x="900" y="0" width="400" height="250" rx="15" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(139, 92, 246, 0.2)" stroke-width="2"/>
    <circle cx="950" cy="50" r="25" fill="url(#iconGradient3)"/>
    <text x="920" y="130" font-family="Arial" font-size="24" font-weight="bold" fill="white">AI-Powered</text>
    <text x="920" y="165" font-family="Arial" font-size="14" fill="#a0a0a0">Intelligent automation</text>
    <text x="920" y="185" font-family="Arial" font-size="14" fill="#a0a0a0">to optimize workflows</text>
  </g>

  <!-- Gradients -->
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#000510;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f0ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff006e;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="buttonGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00f0ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff006e;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="iconGradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f0ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0073e6;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="iconGradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff006e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff4da5;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="iconGradient3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>
